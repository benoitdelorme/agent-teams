<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<style>
  :root{
    --bg:#0e1013; --panel:#13161a; --card:#181c21; --card-hover:#1e232a;
    --border:#252b33; --border-soft:#1d2229;
    --text:#e7e9ec; --muted:#8b929c; --dim:#5a616c;
    --accent:#5aa9ff; --red:#ff6161; --green:#3ecf8e; --amber:#f5b83d;
    --violet:#a78bfa; --cyan:#4dd0e1; --pink:#f06292;
    --r:10px; --r-sm:7px;
    --font:"Inter","SF Pro Text",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,textarea,select{font:inherit;color:inherit}
  ::selection{background:rgba(90,169,255,.25)}
  a{color:var(--accent)}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;height:52px;padding:0 18px;
         border-bottom:1px solid var(--border-soft);background:var(--panel)}
  .brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
  .brand b{font-size:14.5px;font-weight:650;letter-spacing:.1px}
  .brand span{color:var(--muted);font-size:13px;max-width:34vw;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}
  #search{flex:0 1 260px;margin-left:auto;background:var(--card);border:1px solid var(--border);
          border-radius:var(--r-sm);padding:5px 11px;font-size:13px;outline:none;color:var(--text)}
  #search::placeholder{color:var(--dim)}
  #search:focus{border-color:#33507a}
  #teams{display:flex;gap:6px}
  .pill{display:flex;align-items:center;gap:6px;padding:3.5px 10px;border:1px solid var(--border);
        border-radius:99px;font-size:12px;color:var(--muted);background:var(--card)}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
  .pill.working i{background:var(--green);box-shadow:0 0 6px rgba(62,207,142,.7)}
  .pill.idle i{background:var(--amber)}
  .pill.gone i{background:var(--red)}
  #notifications{font-size:11.5px;color:var(--muted);white-space:nowrap}
  #conn{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;transition:background .3s}
  #conn.on{background:var(--green)}

  /* ---------- board ---------- */
  main{display:grid;grid-template-columns:repeat(5,minmax(232px,1fr));gap:12px;
       height:calc(100% - 52px);padding:14px 16px 16px;overflow-x:auto}
  .col{display:flex;flex-direction:column;min-width:0;border-radius:var(--r);
       background:var(--panel);border:1px solid var(--border-soft);transition:border-color .12s, background .12s}
  .col.drop-disabled{opacity:.45}
  .col.drop{border-color:#3a577f;background:#151a21}
  .col-head{display:flex;align-items:center;gap:8px;padding:11px 13px 9px}
  .col-head h2{font-size:12.5px;font-weight:600;color:var(--muted)}
  .col-head .n{font-size:11.5px;color:var(--dim);background:var(--card);border:1px solid var(--border);
               border-radius:99px;padding:1px 7px;font-family:var(--mono)}
  .col-head .add{margin-left:auto;width:22px;height:22px;border:1px solid var(--border);background:var(--card);
                 border-radius:6px;color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
  .col-head .add:hover{color:var(--text);border-color:#3a4250}
  .col-list{flex:1;overflow-y:auto;padding:2px 9px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#2c333d transparent}
  .col-list::-webkit-scrollbar{width:8px}
  .col-list::-webkit-scrollbar-thumb{background:#2c333d;border-radius:4px}
  .empty{border:1.5px dashed var(--border);border-radius:var(--r-sm);color:var(--dim);
         font-size:12.5px;line-height:1.5;text-align:center;padding:18px 10px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);
        padding:9px 11px 8px;cursor:grab;user-select:none;-webkit-user-select:none;
        transition:background .1s,border-color .1s;position:relative}
  .card:hover{background:var(--card-hover);border-color:#323a45}
  .card.blocked{border-left:3px solid var(--red);padding-left:9px}
  .card.dragging{opacity:.3}
  .chips{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
  .chip{font:11px/1 var(--mono);color:var(--muted);background:#12161b;border:1px solid var(--border);
        border-radius:5px;padding:3px 6px}
  .chip.ref{color:#7db3ff}
  a.chip.ref:hover{border-color:#33507a;text-decoration:none}
  .badge{font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
         border-radius:5px;padding:3px 7px}
  .card h3{font-size:13.5px;font-weight:530;line-height:1.35;word-wrap:break-word}
  .card .foot{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--dim)}
  .card .foot .bl{color:var(--red);font-weight:600}
  #ghost{position:fixed;z-index:99;pointer-events:none;width:230px;transform:rotate(2.5deg);
         box-shadow:0 12px 32px rgba(0,0,0,.55);opacity:.95}

  .newform{display:flex}
  .newform input{flex:1;background:var(--card);border:1px solid #33507a;border-radius:var(--r-sm);
                 padding:8px 11px;font-size:13px;outline:none}

  /* ---------- ticket page ---------- */
  #ticket[hidden]{display:none}
  #ticket{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
          animation:rise .16s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:0}}
  .t-top{display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;flex:none;
         border-bottom:1px solid var(--border-soft);background:var(--panel)}
  .t-top .back{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;
               color:var(--muted);font-size:13px;cursor:pointer;padding:5px 9px;border-radius:var(--r-sm)}
  .t-top .back:hover{color:var(--text);background:var(--card)}
  .t-top .chip{font-size:12px;padding:4px 8px}
  .t-top .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .t-scroll{flex:1;overflow-y:auto;padding:28px 24px 60px}
  .t-inner{max-width:1040px;margin:0 auto}
  #t-title{width:100%;background:none;border:1px solid transparent;border-radius:var(--r-sm);resize:none;
           overflow:hidden;font-size:26px;font-weight:640;line-height:1.25;letter-spacing:-.01em;
           padding:6px 8px;margin:0 0 18px -8px;outline:none;font-family:var(--font);display:block}
  #t-title:hover{border-color:var(--border)} #t-title:focus{border-color:#33507a;background:var(--card)}
  .t-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px}
  @media (max-width:760px){.t-grid{grid-template-columns:1fr}}
  .f{margin-bottom:16px}
  .f > label, .f > summary{display:block;font-size:11px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;
           color:var(--dim);margin:0 0 6px}
  .f > summary{cursor:pointer;list-style:none}
  .f > summary::before{content:"▸ ";color:var(--dim)}
  details[open] > summary::before{content:"▾ "}
  textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);
           padding:9px 11px;font-size:13.5px;line-height:1.5;resize:none;overflow:hidden;outline:none;
           font-family:var(--font);display:block}
  textarea:focus{border-color:#33507a}
  textarea::placeholder{color:var(--dim)}
  #t-description{min-height:110px} #t-criteria{min-height:80px}
  select,.side input[type=text]{width:100%;background:var(--card);border:1px solid var(--border);
        border-radius:var(--r-sm);padding:7px 9px;font-size:13px;outline:none;appearance:none}
  select:focus,.side input:focus{border-color:#33507a}
  select{background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%238b929c" fill="none" stroke-width="1.5"/></svg>');
         background-repeat:no-repeat;background-position:right 10px center;padding-right:26px;cursor:pointer}
  .t-top select{width:auto;min-width:150px;padding-top:5px;padding-bottom:5px}
  .switch{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
  .switch input{accent-color:var(--red);width:15px;height:15px}
  .switch.on{color:var(--red)}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--muted);
        border-top:1px solid var(--border-soft);padding-top:14px;margin-top:4px}
  .meta dt{color:var(--dim)}
  .meta dd{overflow-wrap:anywhere}
  .meta dd.path{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .danger{border:1px solid transparent;background:none;color:var(--dim);font-size:12px;cursor:pointer;
          padding:6px 8px;border-radius:var(--r-sm);margin-top:14px}
  .danger:hover{color:var(--red);border-color:rgba(255,97,97,.35)}

  #t-log{background:#0f1216;border:1px solid var(--border-soft);border-radius:var(--r-sm);
         padding:6px 0;max-height:52vh;overflow-y:auto}
  #t-log:empty{display:none}
  .log-line{display:flex;gap:10px;padding:4px 12px;font-size:12.5px;line-height:1.45}
  .log-line:hover{background:#13171d}
  .log-line time{color:var(--dim);font-family:var(--mono);font-size:11.5px;padding-top:1px;flex:none;width:6.5em}
  .log-line .t-agent{color:var(--accent);font-weight:600}
  .log-line .t-ok{color:var(--green);font-weight:600}
  .log-line .t-hot{color:var(--red);font-weight:600}
  .log-line .t-you{color:var(--amber);font-weight:600}
  .log-line a{color:inherit;text-decoration:underline dotted;text-underline-offset:2px}
  .comment{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .comment input[type=text]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);
        border-radius:var(--r-sm);padding:8px 11px;font-size:13px;outline:none}
  .comment input[type=text]:focus{border-color:#33507a}
  .comment label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
  .comment button{background:#1c2b40;border:1px solid #33507a;color:#cfe3ff;border-radius:var(--r-sm);
                  padding:8px 14px;font-size:13px;cursor:pointer}
  .comment button:hover{background:#22344e}
  .comment button:disabled{opacity:.5;cursor:default}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
  .toast{background:#1a1010;border:1px solid rgba(255,97,97,.4);color:#ffb3b3;border-radius:var(--r-sm);
         padding:9px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:in .18s ease-out}
  .toast.ok{background:#0f1a15;border-color:rgba(62,207,142,.35);color:#a9e8cd}
  @keyframes in{from{transform:translateY(8px);opacity:0}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Board</b><span id="plan"></span></div>
  <input id="search" type="text" placeholder="Filter tickets  ( / )" spellcheck="false">
  <div id="teams"></div>
  <span id="notifications" aria-live="polite"></span>
  <div id="conn" title="live"></div>
</header>
<main id="board"></main>
<section id="ticket" hidden></section>
<div id="toasts"></div>

<script>
"use strict";
const COLS = [["backlog","Backlog"],["todo","To do"],["doing","In progress"],["qa","Ready for QA"],["done","Done"]];
const EMPTY = {
  backlog: "Nothing waiting. Press + or n to add a ticket.",
  todo:    "Drag a ticket here when it is ready: the manager gets notified.",
  doing:   "No team is working on anything.",
  qa:      "Nothing to verify.",
  done:    "Nothing done yet.",
};
const TEAM_COLORS = {manager:"var(--amber)", frontend:"var(--cyan)", backend:"var(--violet)", design:"var(--pink)"};
const HUES = ["#4dd0e1","#a78bfa","#f5b83d","#f06292","#81c784","#ffb74d","#64b5f6"];
const $ = s => document.querySelector(s);

let TASKS = new Map();          // id -> task
let META  = {teams: [], ref_base_url: "", shared_dir: "shared", plan_title: "", transitions: {}};
let open_id = null;             // ticket shown on the ticket page
let drag = null;                // {id, ghost, card, over}
let renderQueued = false;

/* ---------- utils ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function teamColor(name){
  if (TEAM_COLORS[name]) return TEAM_COLORS[name];
  let h = 0; for (const c of name) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return HUES[h % HUES.length];
}
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
function rel(iso){
  if (!iso) return "";
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (isNaN(s)) return iso;
  if (s < 50) return "just now";
  if (s < 3600) return `${Math.round(s/60)} min ago`;
  if (s < 86400 && sameDay(d, new Date()))
    return d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}) + " " +
         d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
}
function clock(stamp){
  // log stamps are ISO ("2026-09-13T12:22:54") or bare "12:22:54": show HH:MM, with the day when it is not today
  const d = new Date(stamp.includes("T") ? stamp : `${new Date().toISOString().slice(0,10)}T${stamp}`);
  if (isNaN(d)) return stamp;
  const hm = d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
  return sameDay(d, new Date()) ? hm : d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}) + " " + hm;
}
function toast(msg, ok=false){
  const el = document.createElement("div");
  el.className = "toast" + (ok ? " ok" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
async function api(method, path, body){
  const r = await fetch(path, {method, headers: body ? {"Content-Type":"application/json"} : {},
                               body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `${method} ${path}: ${r.status}`);
  return d;
}
function grow(el){ if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }
function badgeStyle(team){
  const c = teamColor(team);
  return `color:${c};background:color-mix(in srgb,${c} 13%,transparent)`;
}

/* ---------- board rendering ---------- */
function requestRender(){
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; if (!drag) render(); });
}
function sorted(status){
  const ts = [...TASKS.values()].filter(t => t.status === status);
  if (status === "backlog" || status === "todo")
    return ts.sort((a,b) => num(a.id) - num(b.id));
  return ts.sort((a,b) => (b.updated || "").localeCompare(a.updated || ""));
}
const num = id => parseInt(id.slice(1)) || 0;

function render(){
  const q = $("#search").value.trim().toLowerCase();
  const board = $("#board");
  board.innerHTML = COLS.map(([st, label]) => {
    const ts = sorted(st).filter(t => !q || matches(t, q));
    const empty = q ? "No match." : EMPTY[st];
    return `<section class="col" data-status="${st}">
      <div class="col-head"><h2>${label}</h2><span class="n">${ts.length}</span>
        ${st === "backlog" ? '<button class="add" title="New ticket (n)">+</button>' : ""}</div>
      <div class="col-list">${ts.map(cardHTML).join("") || `<div class="empty">${empty}</div>`}</div>
    </section>`;
  }).join("");
  board.querySelectorAll(".card").forEach(el => {
    el.addEventListener("pointerdown", onPointerDown);
    el.addEventListener("click", () => { if (!el.dataset.moved) openTicket(el.dataset.id); });
  });
  const add = board.querySelector(".add");
  if (add) add.addEventListener("click", showNewForm);
}
function matches(t, q){
  return (t.id + " " + t.title + " " + t.ref + " " + t.team).toLowerCase().includes(q);
}
function cardHTML(t){
  const ref = t.ref
    ? (META.ref_base_url
        ? `<a class="chip ref" href="${esc(META.ref_base_url + t.ref)}" target="_blank" rel="noopener">${esc(t.ref)}</a>`
        : `<span class="chip ref">${esc(t.ref)}</span>`)
    : "";
  const team = t.team && t.team !== "-" ? `<span class="badge" style="${badgeStyle(t.team)}">${esc(t.team)}</span>` : "";
  return `<article class="card${t.blocked ? " blocked" : ""}" data-id="${t.id}">
    <div class="chips"><span class="chip">${t.id}</span>${ref}${team}</div>
    <h3>${esc(t.title)}</h3>
    <div class="foot">${t.blocked ? '<span class="bl">blocked</span>' : ""}<span>${rel(t.updated)}</span></div>
  </article>`;
}
function showNewForm(){
  const list = $('.col[data-status="backlog"] .col-list');
  if (!list) return;
  if (list.querySelector(".newform")) return list.querySelector(".newform input").focus();
  const f = document.createElement("div");
  f.className = "newform";
  f.innerHTML = `<input type="text" placeholder="Ticket title, then Enter" spellcheck="false">`;
  list.prepend(f);
  const inp = f.querySelector("input");
  inp.focus();
  inp.addEventListener("keydown", async e => {
    if (e.key === "Escape") return f.remove();
    if (e.key !== "Enter" || !inp.value.trim()) return;
    inp.disabled = true;
    try {
      const t = await api("POST", "/api/tasks", {title: inp.value.trim()});
      TASKS.set(t.id, t); render();
      toast(`${t.id} created in Backlog`, true);
    } catch (err) { toast(err.message); f.remove(); }
  });
  inp.addEventListener("blur", () => { if (!inp.value.trim()) f.remove(); });
}

/* ---------- drag & drop ---------- */
function canTransition(from, to){
  return from === to || (META.transitions?.[from] || []).includes(to);
}
function statusOptions(status){
  return COLS.map(([s,l]) => `<option value="${s}"${canTransition(status,s) ? "" : " disabled"}>${l}</option>`).join("");
}
function onPointerDown(e){
  if (e.button !== 0) return;
  const card = e.currentTarget;
  delete card.dataset.moved;
  const sx = e.clientX, sy = e.clientY;
  const move = ev => {
    if (!drag && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 5) startDrag(card, ev);
    if (drag) dragMove(ev);
  };
  const up = ev => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    if (drag) endDrag(ev);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}
function startDrag(card, ev){
  const ghost = card.cloneNode(true);
  ghost.id = "ghost";
  ghost.style.width = card.offsetWidth + "px";
  document.body.appendChild(ghost);
  card.classList.add("dragging");
  card.dataset.moved = "1";
  drag = {id: card.dataset.id, ghost, card};
  dragMove(ev);
}
function dragMove(ev){
  drag.ghost.style.left = ev.clientX - 20 + "px";
  drag.ghost.style.top  = ev.clientY - 14 + "px";
  const col = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".col");
  const from = TASKS.get(drag.id)?.status;
  document.querySelectorAll(".col").forEach(c => {
    const allowed = canTransition(from, c.dataset.status);
    c.classList.toggle("drop-disabled", !allowed);
    c.classList.toggle("drop", allowed && c === col);
  });
  drag.over = col && canTransition(from, col.dataset.status) ? col.dataset.status : null;
}
async function endDrag(){
  const {id, ghost, card, over} = drag;
  drag = null;
  ghost.remove();
  card.classList.remove("dragging");
  document.querySelectorAll(".col").forEach(c => c.classList.remove("drop", "drop-disabled"));
  const t = TASKS.get(id);
  if (!over || !t || t.status === over || !canTransition(t.status, over)) { render(); return; }
  const prev = t.status;
  t.status = over; render();                        // optimistic
  try {
    const fresh = await api("PATCH", `/api/tasks/${id}`, {status: over});
    TASKS.set(id, fresh); requestRender();
    if (over === "todo") toast(`${id} → To do, the manager is notified`, true);
  } catch (err) {
    t.status = prev; render();
    toast(`${id}: ${err.message}`);
  }
}

/* ---------- ticket page (#T7 in the URL: a ticket is linkable and the back button works) ---------- */
function openTicket(id){
  if (location.hash !== "#" + id) location.hash = id;     // hashchange → route → showTicket
  else showTicket(id);
}
function closeTicket(){
  $("#ticket").hidden = true;
  open_id = null;
  if (location.hash) history.pushState("", "", location.pathname + location.search);
  renderHeader();
}
function route(){
  const id = location.hash.replace(/^#/, "");
  if (id && TASKS.has(id)) showTicket(id);
  else if (open_id) closeTicket();
}
function showTicket(id){
  if (!TASKS.has(id)) return closeTicket();
  const full = open_id !== id;
  open_id = id;
  $("#ticket").hidden = false;          // before rendering: textareas measure their content only when visible
  renderTicket(full);
  renderHeader();
}
const FIELDS = ["description", "criteria", "scope", "verify", "decisions", "depends"];
function renderTicket(full){
  const t = TASKS.get(open_id);
  if (!t) return closeTicket();
  const T = $("#ticket");
  if (full){
    T.innerHTML = `
      <div class="t-top">
        <button class="back" id="t-back" title="Back to the board (Esc)">← Board</button>
        <span class="chip">${t.id}</span>
        <span class="badge" id="t-teambadge"></span>
        <div class="right">
          <label class="switch" id="t-blocked-wrap"><input type="checkbox" id="t-blocked"> Blocked</label>
          <select id="t-status" aria-label="Status">${statusOptions(t.status)}</select>
        </div>
      </div>
      <div class="t-scroll" id="t-scroll"><div class="t-inner">
        <textarea id="t-title" rows="1" spellcheck="false" aria-label="Title"></textarea>
        <div class="t-grid">
          <div>
            <div class="f"><label for="t-description">Description</label><textarea id="t-description" placeholder="Context and goal. The detail agents need to do the work."></textarea></div>
            <div class="f"><label for="t-criteria">Criteria</label><textarea id="t-criteria" placeholder="What makes it done: commands to run, behaviour to see."></textarea></div>
            <details class="f"><summary>Work context (optional)</summary>
              <div class="f"><label for="t-scope">Scope</label><textarea id="t-scope" placeholder="Files or directories involved"></textarea></div>
              <div class="f"><label for="t-verify">Verification</label><textarea id="t-verify" placeholder="Expected commands or checks"></textarea></div>
              <div class="f"><label for="t-decisions">Reference decisions</label><textarea id="t-decisions" placeholder="Documents or sections to follow"></textarea></div>
              <div class="f"><label for="t-depends">Dependencies</label><textarea id="t-depends" placeholder="Related tickets, e.g. T3"></textarea></div>
            </details>
            <div class="f"><label>Log</label><div id="t-log"></div>
              <div class="comment">
                <input type="text" id="t-comment" placeholder="Add a note to the ticket" spellcheck="false">
                <label><input type="checkbox" id="t-notify"> Notify the manager</label>
                <button id="t-send">Add note</button>
              </div></div>
          </div>
          <div class="side">
            <div class="f"><label for="t-team">Team</label><select id="t-team"><option value="-">Unassigned</option>${META.teams.filter(x => !x.primary).map(x => `<option>${esc(x.name)}</option>`).join("")}</select></div>
            <div class="f"><label for="t-ref">Reference</label><input type="text" id="t-ref" placeholder="PROJ-123" spellcheck="false"></div>
            <dl class="meta" id="t-meta"></dl>
            <button class="danger" id="t-del">Delete ticket</button>
          </div>
        </div>
      </div></div>`;
    $("#t-back").onclick = closeTicket;
    bindField("#t-title", "title", v => v.replace(/\s+/g, " ").trim() || null);
    for (const key of FIELDS) bindField("#t-" + key, key);
    bindField("#t-ref", "ref", v => v.trim());
    $("#t-status").onchange = e => patch({status: e.target.value});
    $("#t-team").onchange = e => patch({team: e.target.value});
    $("#t-blocked").onchange = e => patch({blocked: e.target.checked});
    $("#t-send").onclick = sendComment;
    $("#t-comment").addEventListener("keydown", e => { if (e.key === "Enter") sendComment(); });
    T.querySelectorAll("textarea").forEach(el => el.addEventListener("input", () => grow(el)));
    $("#t-title").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); } });
    T.querySelector("details").addEventListener("toggle", () => T.querySelectorAll("details textarea").forEach(grow));
    $("#t-del").onclick = async () => {
      if (!confirm(`Delete ${t.id}?`)) return;
      try { await api("DELETE", `/api/tasks/${t.id}`); TASKS.delete(t.id); closeTicket(); render(); }
      catch (err) { toast(err.message); }
    };
  }
  // values — never clobber the field being edited
  setVal("#t-title", t.title);
  for (const key of FIELDS) setVal("#t-" + key, t[key] || "");
  T.querySelectorAll("textarea").forEach(grow);
  for (const option of $("#t-status").options) option.disabled = !canTransition(t.status, option.value);
  setVal("#t-status", t.status); setVal("#t-team", t.team); setVal("#t-ref", t.ref);
  const bl = $("#t-blocked"); if (document.activeElement !== bl) bl.checked = t.blocked;
  $("#t-blocked-wrap").classList.toggle("on", !!t.blocked);
  const badge = $("#t-teambadge");
  if (t.team && t.team !== "-"){ badge.hidden = false; badge.textContent = t.team; badge.setAttribute("style", badgeStyle(t.team)); }
  else badge.hidden = true;
  $("#t-meta").innerHTML =
      `<dt>Created</dt><dd>${esc(rel(t.created))}</dd>`
    + `<dt>Updated</dt><dd>${esc(rel(t.updated))}</dd>`
    + `<dt>By</dt><dd>${esc(t.by || "?")}</dd>`
    + `<dt>File</dt><dd class="path">${esc(META.shared_dir)}/tasks/${t.id}.md</dd>`;
  const log = $("#t-log"), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
  log.innerHTML = t.log.map(logHTML).join("");
  if (atEnd || full) log.scrollTop = log.scrollHeight;
  if (full) $("#t-scroll").scrollTop = 0;
}
function setVal(sel, v){
  const el = $(sel);
  if (el && document.activeElement !== el && el.value !== String(v ?? "")) el.value = v ?? "";
}
// colour says who is speaking: agents at work (blue), agents finished (green), stopped and needs you (red), you (amber)
const MARKER = {TASK:"t-agent", ASK:"t-agent", CONTRACT:"t-agent", STATUS:"t-agent", DONE:"t-ok", ANSWER:"t-ok", BLOCKED:"t-hot"};
function logHTML(line){
  const m = line.match(/^((?:\d{4}-\d\d-\d\dT)?\d\d:\d\d:\d\d)\s+(.*)$/);
  const time = m ? clock(m[1]) : "", rest = m ? m[2] : line;
  const marked = esc(rest)
    .replace(/\b(TASK|DONE|BLOCKED|ASK|ANSWER|CONTRACT|STATUS)\b/, w => `<span class="${MARKER[w]}">${w}</span>`)
    .replace(/^human:/, `<span class="t-you">human:</span>`)
    .replace(/\b(T\d+)\b/g, (w, id) => id === open_id || !TASKS.has(id) ? w : `<a href="#${id}">${id}</a>`);
  return `<div class="log-line"><time>${esc(time)}</time><span>${marked}</span></div>`;
}
function bindField(sel, key, clean){
  const el = $(sel);
  el.addEventListener("blur", () => {
    const t = TASKS.get(open_id);
    if (!t) return;
    let v = clean ? clean(el.value) : el.value;
    if (v === null) { el.value = t[key]; grow(el); return; }
    if (v !== (t[key] ?? "")) patch({[key]: v});
  });
  if (el.tagName === "INPUT")
    el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); });
}
async function patch(changes){
  const id = open_id;
  try {
    const current = TASKS.get(id);
    if (changes.status && !canTransition(current?.status, changes.status)) { renderTicket(false); return; }
    const t = await api("PATCH", `/api/tasks/${id}`, changes);
    TASKS.set(id, t);
    if (changes.status === "todo" && current?.status !== "todo") toast(`${id} → To do, the manager is notified`, true);
    if (open_id === id) renderTicket(false);
    requestRender();
  } catch (err) {
    toast(err.message);
    if (open_id === id) renderTicket(false);
  }
}
async function sendComment(){
  const inp = $("#t-comment"), btn = $("#t-send"), text = inp.value.trim();
  if (!text) return;
  inp.disabled = btn.disabled = true;
  try {
    const t = await api("POST", `/api/tasks/${open_id}/comment`, {text, notify: $("#t-notify").checked});
    TASKS.set(open_id, t); inp.value = ""; renderTicket(false); requestRender();
  } catch (err) { toast(err.message); }
  inp.disabled = btn.disabled = false; inp.focus();
}

/* ---------- keyboard: / search, n new ticket, Esc back ---------- */
window.addEventListener("hashchange", route);
window.addEventListener("keydown", e => {
  const active = document.activeElement;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(active?.tagName || "");
  if (e.key === "Escape"){
    if (typing && active !== $("#search")) return active.blur();
    if (open_id) return closeTicket();
    const s = $("#search");
    if (s.value){ s.value = ""; render(); }
    s.blur();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/"){ e.preventDefault(); $("#search").focus(); $("#search").select(); }
  if (e.key === "n" && !open_id){ e.preventDefault(); showNewForm(); }
});

/* ---------- header / state ---------- */
function renderHeader(){
  const pending = META.pending_notifications || 0;
  $("#notifications").textContent = pending ? `${pending} notification${pending > 1 ? "s" : ""} pending` : "";
  $("#notifications").title = META.notify_available
    ? "The queue will be delivered to the manager."
    : "The manager cannot be reached automatically right now. The queue is kept.";
  $("#plan").textContent = META.plan_title || "";
  document.title = (open_id ? open_id + " — " : "") + (META.plan_title ? META.plan_title + " — " : "") + "Board";
  $("#teams").innerHTML = META.teams.map(t =>
    `<div class="pill ${esc(t.status)}" title="${esc(t.purpose)} — ${esc(t.status)}${t.updated ? " (" + esc(rel(t.updated)) + ")" : ""}">
       <i></i>${esc(t.title || t.name)}</div>`).join("");
}

/* ---------- live ---------- */
async function resync(){
  const [tasks, state] = await Promise.all([api("GET", "/api/tasks"), api("GET", "/api/state")]);
  TASKS = new Map(tasks.map(t => [t.id, t]));
  META = state;
  renderHeader(); render();
  if (open_id) TASKS.has(open_id) ? renderTicket(false) : closeTicket();
  else route();
}
function connect(){
  const es = new EventSource("/events");
  es.onopen = () => { $("#conn").classList.add("on"); resync().catch(() => {}); };
  es.onerror = () => $("#conn").classList.remove("on");
  es.addEventListener("task", e => {
    const t = JSON.parse(e.data);
    TASKS.set(t.id, t);
    requestRender();
    if (open_id === t.id) renderTicket(false);
  });
  es.addEventListener("task-deleted", e => {
    const {id} = JSON.parse(e.data);
    TASKS.delete(id);
    requestRender();
    if (open_id === id) closeTicket();
  });
  es.addEventListener("state", e => { META = JSON.parse(e.data); renderHeader(); });
}
$("#search").addEventListener("input", () => render());
setInterval(() => { if (!drag) requestRender(); }, 30_000);   // relative times
resync().then(connect).catch(err => { toast("Server unreachable: " + err.message); connect(); });
</script>
</body>
